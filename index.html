<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Galaxy YouTube Player</title>
  
  <!-- PWA / App Manifest -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0a0a0a">
  
  <!-- Apple iOS specific tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon-192.png">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; }
    html, body { min-height: 100%; }

    :root {
      --acc1: #723ed8;
      --acc2: #3b1f91;
      --glow: rgba(124, 71, 255, 0.4);
      --ring: rgba(136, 98, 221, 0.3);
      --text-soft: rgba(233, 228, 255, 0.65);
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 16px;
      padding: 16px;
      overflow-x: hidden;
      transition: background 0.8s ease;
      -webkit-font-smoothing: antialiased;
      background-color: #000;
    }

    /* ============================================================
       CUSTOM DRIVE PHOTO BACKGROUND
       ============================================================ */
    #customBgLayer {
      position: fixed; inset: 0; z-index: 0;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      opacity: 0;
      transition: opacity 0.8s ease;
      pointer-events: none;
    }
    #customBgLayer::after {
      content: ""; position: absolute; inset: 0;
      background: rgba(0, 0, 0, 0.65);
    }
    .mode-off.has-custom-bg #customBgLayer { opacity: 1; }
    .mode-off.has-custom-bg::before { display: none !important; }

    /* ============================================================
       MODES & IMMERSIVE THEMES
       ============================================================ */
    .mode-on { background: #0a0a0a; }

    .mode-off {
      justify-content: center;
      align-items: center;
    }

    .mode-off::before {
      content: "";
      position: fixed; inset: 0;
      z-index: 0; pointer-events: none;
      transition: opacity 0.8s ease;
    }

    /* 🟣 GALAXY */
    .mode-off.theme-galaxy {
      --acc1: #8b5cf6;  --acc2: #4c1d95;
      --glow: rgba(139, 92, 246, 0.45);
      --ring: rgba(139, 92, 246, 0.3);
      --text-soft: rgba(221, 214, 254, 0.6);
    }
    .mode-off.theme-galaxy::before {
      background: 
        radial-gradient(circle at 50% 40%, rgba(76, 29, 149, 0.4) 0%, transparent 60%),
        radial-gradient(2px 2px at 20px 30px, #fff, transparent),
        radial-gradient(1px 1px at 40px 70px, #fff, transparent),
        radial-gradient(2px 2px at 90px 40px, #d8b4fe, transparent),
        radial-gradient(1px 1px at 130px 80px, #fff, transparent),
        radial-gradient(2px 2px at 160px 120px, #a78bfa, transparent);
      background-repeat: repeat;
      background-size: 100% 100%, 200px 200px, 200px 200px, 200px 200px, 200px 200px, 200px 200px;
      animation: twinkle 6s ease-in-out infinite alternate;
    }

    /* 🟢 AURORA */
    .mode-off.theme-aurora {
      --acc1: #2dd4bf;  --acc2: #0f766e;
      --glow: rgba(45, 212, 191, 0.45);
      --ring: rgba(45, 212, 191, 0.3);
      --text-soft: rgba(204, 251, 241, 0.6);
    }
    .mode-off.theme-aurora::before {
      background: 
        radial-gradient(ellipse 600px 300px at 50% 60%, rgba(20, 184, 166, 0.15) 0%, transparent 70%),
        radial-gradient(ellipse 400px 200px at 20% 20%, rgba(45, 212, 191, 0.1) 0%, transparent 70%);
      animation: auroraShift 10s ease-in-out infinite alternate;
    }

    /* 🟠 EMBER */
    .mode-off.theme-ember {
      --acc1: #f97316;  --acc2: #9a3412;
      --glow: rgba(249, 115, 22, 0.45);
      --ring: rgba(249, 115, 22, 0.3);
      --text-soft: rgba(254, 215, 170, 0.6);
    }
    .mode-off.theme-ember::before {
      background: 
        radial-gradient(ellipse 800px 400px at 50% 110%, rgba(249, 115, 22, 0.15) 0%, transparent 60%),
        radial-gradient(ellipse 500px 250px at 30% 120%, rgba(239, 68, 68, 0.1) 0%, transparent 70%);
      animation: emberGlow 8s ease-in-out infinite alternate;
    }

    /* 📷 CUSTOM PHOTO THEMES */
    .mode-off.theme-photo-1,
    .mode-off.theme-photo-2,
    .mode-off.theme-photo-3 {
      --acc1: #ffffff;  --acc2: #cccccc;
      --glow: rgba(255, 255, 255, 0.3);
      --ring: rgba(255, 255, 255, 0.4);
      --text-soft: rgba(255, 255, 255, 0.85);
    }

    @keyframes twinkle { 0%{opacity:.6} 100%{opacity:1} }
    @keyframes auroraShift { 0%{transform: scale(1) translateY(0)} 100%{transform: scale(1.1) translateY(-20px)} }
    @keyframes emberGlow { 0%{opacity:.7} 100%{opacity:1} }

    /* ============================================================
       CONTAINER
       ============================================================ */
    .container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 640px;
    }
    .mode-off .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 32px);
    }

    /* ============================================================
       SCREEN-ON UI (Mobile Optimized)
       ============================================================ */
    .input-row { 
      display: flex; 
      gap: 8px; 
      width: 100%; 
      flex-wrap: wrap; 
      margin-bottom: 8px;
      animation: slideDown 0.3s ease;
    }
    .hidden-search {
      display: none !important;
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #searchInput {
      flex: 1 1 100%; 
      padding: 14px; 
      border-radius: 10px;
      border: none; 
      font-size: 16px; 
      outline: none;
      background: #fff;
    }
    .input-actions {
      display: flex;
      gap: 8px;
      width: 100%;
      flex: 1 1 100%;
    }
    #searchBtn, #loadBtn {
      flex: 1;
      padding: 14px 10px; 
      border-radius: 10px; 
      border: none; 
      color: #fff;
      font-size: 15px; 
      font-weight: 600;
      cursor: pointer; 
      white-space: nowrap;
      transition: 0.2s;
    }
    #searchBtn:active, #loadBtn:active { transform: scale(0.97); }
    #searchBtn { background: #ff4444; }
    #loadBtn   { background: #723ed8; }

    /* Perfect Grid Layout for Mobile Toolbar */
    .toolbar { 
      display: grid; 
      grid-template-columns: repeat(2, 1fr); 
      gap: 8px; 
      width: 100%;
    }
    
    .toggle-btn, .pill-btn {
      padding: 12px 8px; 
      border-radius: 10px; 
      border: 1px solid #8862dd80;
      background: rgba(60,30,130,.35); 
      color: #e3d9ff; 
      font-size: 14px;
      font-weight: 500;
      cursor: pointer; 
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px); 
      transition: .25s; 
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .toggle-btn:hover, .pill-btn:hover { background: rgba(90,50,180,.5); }
    
    .pill-btn .count {
      display: inline-block; min-width: 18px; padding: 1px 5px; margin-left: 6px;
      border-radius: 10px; background: rgba(255,255,255,.16); font-size: 12px; text-align: center;
    }

    /* Hidden buttons logic */
    .hidden-btn {
      display: none !important;
    }

    /* --- Settings Panel --- */
    .settings-panel {
      display: none;
      background: rgba(30, 20, 60, 0.8);
      border: 1px solid #8862dd80;
      border-radius: 12px;
      padding: 16px;
      margin-top: 12px;
      backdrop-filter: blur(8px);
    }
    .settings-panel.open { display: block; }
    .settings-panel h4 { color: #e3d9ff; margin-bottom: 12px; font-size: 15px; }
    .setting-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
    .setting-row label { color: #b9a6e8; font-size: 13px; width: 60px; }
    .setting-row input { 
      flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #8862dd44; 
      background: rgba(0,0,0,0.4); color: #fff; font-size: 14px; outline: none;
    }
    .setting-row input:focus { border-color: #8862dd; }
    .settings-save-btn {
      width: 100%; padding: 12px; margin-top: 8px; border-radius: 8px; border: none;
      background: #723ed8; color: #fff; font-weight: bold; cursor: pointer;
    }

    .saved-banner {
      display: none; align-items: center; justify-content: space-between;
      gap: 10px; margin-top: 12px; padding: 10px 12px; border-radius: 12px;
      background: rgba(40,20,90,.55); border: 1px solid #8862dd66;
      backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    }
    .saved-label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #a795e0; }
    .saved-title { color: #efeaff; font-size: 14px; margin: 2px 0; word-break: break-word; }
    .saved-meta  { color: #9d92c8; font-size: 12px; }
    .saved-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .mini-btn {
      padding: 8px 12px; border-radius: 8px; border: 1px solid #8862dd66;
      background: rgba(70,40,150,.4); color: #e3d9ff; font-size: 13px;
      cursor: pointer; transition: .2s;
    }
    .mini-btn:hover { background: rgba(110,60,210,.55); }
    .mini-btn.primary {
      background: linear-gradient(135deg,#723ed8,#3b1f91);
      border-color: transparent; color: #fff;
    }

    #playerWrap {
      margin-top: 12px; width: 100%; aspect-ratio: 16/9;
      background: #000; border-radius: 12px; overflow: hidden;
    }
    #player, #playerWrap iframe {
      display: block; width: 100% !important; height: 100% !important;
      border: 0; border-radius: 12px;
    }

    /* ============================================================
       SCREEN-OFF — CLEAN GALAXY VIEW
       ============================================================ */
    .mode-off .input-row,
    .mode-off .toolbar,
    .mode-off .settings-panel,
    .mode-off .saved-banner,
    .mode-off #playerWrap { display: none !important; }

    .mode-off.idle .galaxy-ui {
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px);
    }

    .galaxy-ui {
      display: none;
      width: 100%;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      transition: opacity 1.2s ease, transform 1.2s ease;
    }
    .mode-off .galaxy-ui { display: flex; }

    .theme-dots {
      display: flex;
      gap: 16px;
      margin-bottom: 50px;
      flex-wrap: wrap;
      justify-content: center;
      padding: 0 20px;
    }
    .theme-dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      padding: 0;
      opacity: 0.4;
      position: relative;
      transition: 0.3s ease;
    }
    .theme-dot::after {
      content: "";
      position: absolute; inset: -4px;
      border-radius: 50%;
      border: 1px solid transparent;
      transition: 0.3s ease;
    }
    .theme-dot[data-theme="galaxy"] { background: #a78bfa; }
    .theme-dot[data-theme="aurora"] { background: #2dd4bf; }
    .theme-dot[data-theme="ember"]  { background: #f97316; }
    .theme-dot[data-theme="photo-1"],
    .theme-dot[data-theme="photo-2"],
    .theme-dot[data-theme="photo-3"] { background: #fff; box-shadow: 0 0 4px rgba(0,0,0,0.5); }
    
    .theme-dot:hover { opacity: 0.8; }
    .theme-dot.active { opacity: 1; transform: scale(1.2); }
    .theme-dot.active::after { border-color: rgba(255,255,255,0.8); }

    .galaxy-main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 36px;
      width: 100%;
      padding: 0 20px;
    }

    #songTitle {
      color: var(--text-soft);
      font-size: 15px;
      font-weight: 400;
      letter-spacing: 0.5px;
      max-width: 80%;
      line-height: 1.6;
      word-break: break-word;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      transition: opacity 0.3s ease;
    }

    .play-btn {
      width: 120px; height: 120px;
      border-radius: 50%;
      border: none;
      font-size: 42px;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--acc1), var(--acc2));
      box-shadow: 0 0 50px var(--glow), inset 0 0 20px rgba(255,255,255,0.15);
      transition: 0.3s ease;
    }
    .play-btn:hover { box-shadow: 0 0 70px var(--glow), inset 0 0 20px rgba(255,255,255,0.2); }
    .play-btn:active { transform: scale(0.92); }
    .play-btn svg { margin-left: 6px; }

    .galaxy-row {
      display: flex;
      gap: 18px;
      justify-content: center;
      margin-top: 10px;
    }
    .g-icon-btn {
      width: 44px; height: 44px;
      border-radius: 50%;
      border: 1px solid var(--ring);
      background: rgba(20, 15, 40, 0.25);
      color: var(--text-soft);
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.3s ease;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 0;
    }
    .g-icon-btn:hover {
      background: rgba(40, 30, 70, 0.6);
      color: #fff;
      transform: translateY(-2px);
      border-color: var(--acc1);
      box-shadow: 0 4px 15px var(--glow);
    }
    .g-icon-btn:active { transform: scale(0.9); }

    /* ============================================================
       LOCKED STATE (SCREEN-OFF)
       ============================================================ */
    .mode-off.is-locked .play-btn,
    .mode-off.is-locked .theme-dots,
    .mode-off.is-locked #gHistoryBtn,
    .mode-off.is-locked #gSaveBtn,
    .mode-off.is-locked #gScreenBtn {
      opacity: 0.3;
      pointer-events: none;
      filter: grayscale(50%);
    }
    .mode-off.is-locked #songTitle {
      opacity: 0.5;
    }
    .mode-off.is-locked #gLockBtn {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.5);
      color: #fff;
      box-shadow: 0 0 15px rgba(255,255,255,0.2);
    }

    /* ============================================================
       LOCK SCREEN OVERLAY (PIN PAD)
       ============================================================ */
    .lock-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .lock-overlay.show {
      display: flex;
      opacity: 1;
    }

    .lock-icon-large {
      font-size: 40px;
      color: rgba(255, 255, 255, 0.2);
      margin-bottom: 20px;
    }

    .pin-display {
      display: flex;
      gap: 16px;
      margin-bottom: 40px;
    }
    .pin-dot {
      width: 14px; height: 14px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.4);
      transition: all 0.2s ease;
    }
    .pin-dot.filled {
      background: #fff;
      border-color: #fff;
      box-shadow: 0 0 10px rgba(255,255,255,0.5);
    }
    .pin-dot.error {
      border-color: #ff4444;
      background: #ff4444;
      animation: shake 0.4s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      max-width: 280px;
      width: 100%;
      padding: 0 20px;
    }
    .key-btn {
      width: 70px; height: 70px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      font-size: 24px;
      font-weight: 300;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s ease;
      margin: 0 auto;
    }
    .key-btn:hover { background: rgba(255, 255, 255, 0.15); }
    .key-btn:active { background: rgba(255, 255, 255, 0.3); transform: scale(0.9); }
    .key-btn.empty { visibility: hidden; }
    .key-btn.action { font-size: 18px; color: var(--text-soft); }

    /* ============================================================
       HISTORY PANEL
       ============================================================ */
    .history-panel {
      display: none;
      margin-top: 12px;
      border-radius: 12px;
      background: rgba(20,10,50,.6);
      border: 1px solid #8862dd44;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      overflow: hidden;
    }
    .history-panel.open { display: block; }

    .mode-off .history-panel {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 440px;
      max-height: 55vh;
      z-index: 50;
      margin-top: 0;
      background: rgba(15, 10, 30, 0.95);
      border-color: var(--ring);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 20px var(--glow);
      animation: slideUp 0.3s ease;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateX(-50%) translateY(20px); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    .history-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 12px; border-bottom: 1px solid #8862dd33;
      color: #c9bdf2; font-size: 14px;
    }
    .history-head-actions { display: flex; gap: 8px; align-items: center; }
    .close-history-btn {
      background: transparent; border: none; color: #b9a6e8; cursor: pointer;
      font-size: 16px; padding: 4px 8px; border-radius: 6px; transition: 0.2s;
    }
    .close-history-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }

    .history-list { max-height: 250px; overflow-y: auto; padding: 6px; }
    .history-empty { padding: 18px 12px; text-align: center; color: #8e82b8; font-size: 13px; }
    .history-item {
      display: flex; align-items: center; gap: 10px; padding: 8px 10px;
      border-radius: 8px; cursor: pointer; transition: background .15s;
    }
    .history-item:hover  { background: rgba(120,80,220,.18); }
    .history-item:active { background: rgba(120,80,220,.3); }
    .h-play {
      flex-shrink: 0; width: 26px; height: 26px; line-height: 26px;
      text-align: center; border-radius: 50%; font-size: 11px; color: #fff;
      background: linear-gradient(135deg, var(--acc1), var(--acc2));
    }
    .h-info { flex: 1 1 auto; min-width: 0; }
    .h-title {
      color: #e9e4ff; font-size: 13.5px; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }
    .h-meta { color: #9186bd; font-size: 11.5px; margin-top: 1px; }
    .h-del {
      flex-shrink: 0; border: none; background: transparent; color: #b9a6e8;
      font-size: 14px; padding: 4px 8px; border-radius: 6px; cursor: pointer;
      opacity: .65; transition: .2s;
    }
    .h-del:hover { opacity: 1; color: #ff8080; background: rgba(255,80,80,.12); }

    /* ============================================================
       RESPONSIVE
       ============================================================ */
    @media (max-width: 380px) {
      .play-btn   { width: 110px; height: 110px; font-size: 38px; }
      .g-icon-btn { width: 40px;  height: 40px;  font-size: 16px; }
      .galaxy-row { gap: 12px; }
      #songTitle  { font-size: 14px; }
      .key-btn    { width: 60px; height: 60px; font-size: 20px; }
      .keypad     { gap: 15px; }
    }
  </style>
</head>
<body class="mode-on theme-galaxy">

  <div id="customBgLayer"></div>

  <div class="container">
    <!-- ===== SCREEN-ON UI ===== -->
    
    <!-- Hidden by default, toggled by Search button -->
    <div class="input-row hidden-search" id="searchContainer">
      <input id="searchInput" placeholder="Paste YouTube link / ID...">
      <div class="input-actions">
        <button id="searchBtn" type="button">Search</button>
        <button id="loadBtn"   type="button">Load</button>
      </div>
    </div>

    <div class="toolbar">
      <button class="toggle-btn" id="viewToggle" type="button">Screen: ON</button>
      <button class="pill-btn"   id="historyBtn" type="button">🕘 History <span class="count" id="historyCount">0</span></button>
      
      <button class="pill-btn" id="toggleSearchBtn" type="button">🔍 Search Video</button>
      <button class="pill-btn" id="toggleMoreBtn" type="button">⚙️ More</button>

      <!-- Hidden by default -->
      <button class="pill-btn hidden-btn" id="saveBtn" type="button">💾 Save Current</button>
      <button class="pill-btn hidden-btn" id="settingsBtn" type="button">📷 Photo Themes</button>
    </div>

    <!-- Settings Panel -->
    <div class="settings-panel" id="settingsPanel">
      <h4>Google Drive Photo Backgrounds (Max 3)</h4>
      <p style="font-size:11px; color:#9186bd; margin-bottom:12px;">Ensure Drive file sharing is set to "Anyone with the link".</p>
      <div class="setting-row">
        <label>Theme 1</label>
        <input type="text" id="photoId1" placeholder="Drive File ID...">
      </div>
      <div class="setting-row">
        <label>Theme 2</label>
        <input type="text" id="photoId2" placeholder="Drive File ID...">
      </div>
      <div class="setting-row">
        <label>Theme 3</label>
        <input type="text" id="photoId3" placeholder="Drive File ID...">
      </div>
      <button class="settings-save-btn" id="saveSettingsBtn" type="button">Save Photo IDs</button>
    </div>

    <div class="saved-banner" id="savedBanner">
      <div style="min-width:0;">

<script src="https://www.youtube.com/iframe_api"></script>
<script>
(function () {
  'use strict';

  var HISTORY_LIMIT = 40;
  var THEMES = ['galaxy', 'aurora', 'ember', 'photo-1', 'photo-2', 'photo-3'];

  /* ============================================================
     CLOUDFLARE WORKER CONFIGURATION
     ============================================================ */
  // PASTE YOUR CLOUDFLARE WORKER URL HERE
  var WORKER_URL = "https://tight-mouse-a2d5.ppap-tec-2022.workers.dev/"; 
  
  // Check if we have a valid worker URL to connect to
  var HAS_SERVER = (WORKER_URL && !WORKER_URL.includes("YOUR_WORKER_SUBDOMAIN"));

  /* ---------------- state ---------------- */
  var player = null;
  var isPlaying = false;
  var screenOn = true;
  var isLocked = false;
  var currentVideoId = null;
  var currentVideoTitle = '';
  var pendingSeek = 0;
  var recordedThisPlayer = false;
  var historyCache = [];
  var savedCache = null;
  var currentTheme = 'galaxy';
  
  var customPhotoIds = ['', '', ''];
  
  // Auto-Hide state
  var idleTimer = null;
  var isIdle = false;

  // Lock Screen State
  var enteredPin = '';
  var correctPin = '1234';

  /* ---------------- elements ---------------- */
  var searchContainer = document.getElementById('searchContainer');
  var searchInput     = document.getElementById('searchInput');
  var searchBtn       = document.getElementById('searchBtn');
  var loadBtn         = document.getElementById('loadBtn');
  var toggleBtn       = document.getElementById('viewToggle');
  var toggleSearchBtn = document.getElementById('toggleSearchBtn');
  var toggleMoreBtn   = document.getElementById('toggleMoreBtn');
  var saveBtn         = document.getElementById('saveBtn');
  var historyBtn      = document.getElementById('historyBtn');
  var historyCount    = document.getElementById('historyCount');
  var settingsBtn     = document.getElementById('settingsBtn');
  var settingsPanel   = document.getElementById('settingsPanel');
  var photoId1        = document.getElementById('photoId1');
  var photoId2        = document.getElementById('photoId2');
  var photoId3        = document.getElementById('photoId3');
  var saveSettingsBtn = document.getElementById('saveSettingsBtn');
  
  var savedBanner     = document.getElementById('savedBanner');
  var savedTitle      = document.getElementById('savedTitle');
  var savedMeta       = document.getElementById('savedMeta');
  var resumeBtn       = document.getElementById('resumeBtn');
  var dismissSavedBtn = document.getElementById('dismissSavedBtn');
  var playerWrap      = document.getElementById('playerWrap');
  var galaxyUI        = document.getElementById('galaxyUI');
  var playBtn         = document.getElementById('playBtn');
  var playIcon        = document.getElementById('playIcon');
  var songTitle       = document.getElementById('songTitle');
  var historyPanel    = document.getElementById('historyPanel');
  var historyList     = document.getElementById('historyList');
  var closeHistoryBtn = document.getElementById('closeHistoryBtn');
  var clearHistoryBtn = document.getElementById('clearHistoryBtn');
  var themeDots       = document.getElementById('themeDots');
  var dotPhoto1       = document.getElementById('dotPhoto1');
  var dotPhoto2       = document.getElementById('dotPhoto2');
  var dotPhoto3       = document.getElementById('dotPhoto3');
  var customBgLayer   = document.getElementById('customBgLayer');
  
  var gSaveBtn        = document.getElementById('gSaveBtn');
  var gHistoryBtn     = document.getElementById('gHistoryBtn');
  var gLockBtn        = document.getElementById('gLockBtn');
  var gScreenBtn      = document.getElementById('gScreenBtn');
  
  var lockOverlay     = document.getElementById('lockOverlay');
  var pinDisplay      = document.getElementById('pinDisplay');
  var dots            = [document.getElementById('dot0'), document.getElementById('dot1'), document.getElementById('dot2'), document.getElementById('dot3')];
  var keypad          = document.getElementById('keypad');
  var backspaceBtn    = document.getElementById('backspaceBtn');
  
  var body            = document.body;

  /* ---------------- storage ---------------- */
  function lsGet(k, d){ try{ var r=localStorage.getItem(k); return r===null?d:JSON.parse(r);}catch(e){return d;} }
  function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
  function lsRemove(k){ try{ localStorage.removeItem(k); }catch(e){} }
  var LS_HISTORY = 'galaxy_yt_history_v1';
  var LS_SAVED   = 'galaxy_yt_saved_v1';
  var LS_THEME   = 'galaxy_yt_theme_v1';
  var LS_PHOTOS  = 'galaxy_yt_photos_v1';

  /* ---------------- Cloudflare Worker API Wrapper ---------------- */
  function serverCall(fnName, args) {
    return new Promise(function (resolve, reject) {
      if (!HAS_SERVER) { reject(new Error('Worker URL not configured')); return; }

      fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: fnName, args: args || [] })
      })
      .then(response => {
        if (!response.ok) throw new Error("Network response was not ok");
        return response.json();
      })
      .then(data => {
        if (data && data.error) reject(new Error(data.error));
        else resolve(data);
      })
      .catch(reject);
    });
  }

  /* ---------------- data layer ---------------- */
  function apiGetHistory() {
    if (!HAS_SERVER) {
      var local = lsGet(LS_HISTORY, []);
      return Promise.resolve(Array.isArray(local) ? local : []);
    }
    return serverCall('getHistory').catch(function (e) { 
      console.warn('getHistory failed', e); 
      var local = lsGet(LS_HISTORY, []);
      return Array.isArray(local) ? local : [];
    });
  }
  function apiAddHistory(id, title) {
    if (!HAS_SERVER) {
      var local = lsGet(LS_HISTORY, []);
      if (!Array.isArray(local)) local = [];
      local = local.filter(function (x) { return x.id !== id; });
      local.unshift({ id: id, title: title || '', at: Date.now() });
      if (local.length > HISTORY_LIMIT) local = local.slice(0, HISTORY_LIMIT);
      lsSet(LS_HISTORY, local);
      return Promise.resolve(local);
    }
    return serverCall('addHistory', [id, title || '']).catch(function (e) { 
      console.warn('addHistory failed', e); 
      return historyCache; 
    });
  }
  function apiRemoveHistory(id) {
    if (!HAS_SERVER) {
      var local = lsGet(LS_HISTORY, []).filter(function (x) { return x.id !== id; });
      lsSet(LS_HISTORY, local);
      return Promise.resolve(local);
    }
    return serverCall('removeHistory', [id]).catch(function (e) { 
      console.warn('removeHistory failed', e); 
      return historyCache; 
    });
  }
  function apiClearHistory() {
    if (!HAS_SERVER) { lsRemove(LS_HISTORY); return Promise.resolve([]); }
    return serverCall('clearHistory').catch(function (e) { 
      console.warn('clearHistory failed', e); 
      return []; 
    });
  }
  function apiGetSaved() {
    if (!HAS_SERVER) return Promise.resolve(lsGet(LS_SAVED, null));
    return serverCall('getSaved').catch(function (e) { 
      console.warn('getSaved failed', e); 
      return null; 
    });
  }
  function apiSaveState(id, title, time) {
    if (!HAS_SERVER) {
      var s = { id: id, title: title || '', time: time || 0, at: Date.now() };
      lsSet(LS_SAVED, s);
      return Promise.resolve(s);
    }
    return serverCall('saveState', [id, title || '', time || 0]).catch(function (e) { 
      console.warn('saveState failed', e); 
      return null; 
    });
  }
  function apiClearSaved() {
    if (!HAS_SERVER) { lsRemove(LS_SAVED); return Promise.resolve(null); }
    return serverCall('clearSaved').catch(function (e) { 
      console.warn('clearSaved failed', e); 
      return null; 
    });
  }

  /* ---------------- time helpers ---------------- */
  function formatTime(sec) {
    sec = Math.max(0, Math.floor(sec || 0));
    var h = Math.floor(sec / 3600);
    var m = Math.floor((sec % 3600) / 60);
    var s = sec % 60;
    var mm = (m < 10 ? '0' : '') + m;
    var ss = (s < 10 ? '0' : '') + s;
    return h > 0 ? h + ':' + mm + ':' + ss : mm + ':' + ss;
  }
  function timeAgo(ts) {
    if (!ts) return '';
    var diff = Math.floor((Date.now() - ts) / 1000);
    if (diff < 45)     return 'just now';
    if (diff < 3600)   return Math.floor(diff / 60) + ' min ago';
    if (diff < 86400)  return Math.floor(diff / 3600) + ' hr ago';
    if (diff < 604800) return Math.floor(diff / 86400) + ' d ago';
    try { return new Date(ts).toLocaleDateString(); } catch (e) { return ''; }
  }

  /* ---------------- YouTube API ---------------- */
  var ytReady = false, ytWaiters = [];
  window.onYouTubeIframeAPIReady = function () {
    ytReady = true;
    var list = ytWaiters; ytWaiters = [];
    for (var i = 0; i < list.length; i++) { try { list[i](); } catch (e) {} }
  };
  function withPlayerApi(cb) {
    if (ytReady || (window.YT && window.YT.Player)) { cb(); return; }
    if (ytWaiters.length === 0) {
      setTimeout(function () {
        if (!(window.YT && window.YT.Player)) {
          ytWaiters = [];
          alert('YouTube player could not load.\nCheck your connection and reload.');
        }
      }, 12000);
    }
    ytWaiters.push(cb);
  }

  /* ---------------- url helpers ---------------- */
  function extractVideoId(input) {
    var str = (input || '').trim();
    if (!str) return null;
    var patterns = [
      /[?&]v=([A-Za-z0-9_-]{11})/,
      /youtu\.be\/([A-Za-z0-9_-]{11})/,
      /youtube\.com\/shorts\/([A-Za-z0-9_-]{11})/,
      /youtube\.com\/embed\/([A-Za-z0-9_-]{11})/,
      /youtube\.com\/live\/([A-Za-z0-9_-]{11})/
    ];
    for (var i = 0; i < patterns.length; i++) {
      var m = str.match(patterns[i]);
      if (m) return m[1];
    }
    if (/^[A-Za-z0-9_-]{11}$/.test(str)) return str;
    return null;
  }
  function openExternal(url) {
    try {
      var a = document.createElement('a');
      a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
    } catch (e) { window.open(url, '_blank'); }
  }

  /* ============================================================
     AUTO-HIDE LOGIC
     ============================================================ */
  function resetIdleTimer() {
    if (isIdle) {
      isIdle = false;
      body.classList.remove('idle');
    }
    clearTimeout(idleTimer);
    
    if (!screenOn && !historyPanel.classList.contains('open') && !settingsPanel.classList.contains('open') && !lockOverlay.classList.contains('show')) {
      idleTimer = setTimeout(function () {
        isIdle = true;
        body.classList.add('idle');
      }, 5000);
    }
  }

  ['mousemove', 'touchstart', 'click', 'keydown'].forEach(function(evt) {
    document.addEventListener(evt, resetIdleTimer, { passive: true });
  });

  /* ============================================================
     LOCK SCREEN LOGIC
     ============================================================ */
  function updatePinDots() {
    for (var i = 0; i < 4; i++) {
      dots[i].classList.toggle('filled', i < enteredPin.length);
      dots[i].classList.remove('error');
    }
  }

  function lockScreen() {
    isLocked = true;
    gLockBtn.textContent = '🔓';
    gLockBtn.title = "Tap to Unlock";
    body.classList.add('is-locked');
    resetIdleTimer();
  }

  function requestUnlock() {
    enteredPin = '';
    updatePinDots();
    lockOverlay.classList.add('show');
    clearTimeout(idleTimer);
    body.classList.remove('idle');
  }

  function unlockScreen() {
    isLocked = false;
    lockOverlay.classList.remove('show');
    gLockBtn.textContent = '🔒';
    gLockBtn.title = "Lock Screen";
    body.classList.remove('is-locked');
    resetIdleTimer();
  }

  function handleKeyPress(key) {
    if (enteredPin.length < 4) {
      enteredPin += key;
      updatePinDots();
    }
    
    if (enteredPin.length === 4) {
      setTimeout(function() {
        if (enteredPin === correctPin) {
          unlockScreen();
        } else {
          for (var i = 0; i < 4; i++) dots[i].classList.add('error');
          setTimeout(function() {
            enteredPin = '';
            updatePinDots();
          }, 600);
        }
      }, 200);
    }
  }

  keypad.addEventListener('click', function(e) {
    var btn = e.target.closest('.key-btn');
    if (!btn || btn.classList.contains('empty') || btn.classList.contains('action')) return;
    var key = btn.getAttribute('data-key');
    if (key) handleKeyPress(key);
  });

  backspaceBtn.addEventListener('click', function() {
    enteredPin = enteredPin.slice(0, -1);
    updatePinDots();
  });

  /* ---------------- custom photo themes ---------------- */
  function loadPhotoSettings() {
    var saved = lsGet(LS_PHOTOS, ['', '', '']);
    customPhotoIds = Array.isArray(saved) && saved.length === 3 ? saved : ['', '', ''];
    
    photoId1.value = customPhotoIds[0];
    photoId2.value = customPhotoIds[1];
    photoId3.value = customPhotoIds[2];
    
    dotPhoto1.style.display = customPhotoIds[0] ? 'block' : 'none';
    dotPhoto2.style.display = customPhotoIds[1] ? 'block' : 'none';
    dotPhoto3.style.display = customPhotoIds[2] ? 'block' : 'none';
    
    applyTheme(currentTheme);
  }

  function savePhotoSettings() {
    customPhotoIds[0] = photoId1.value.trim();
    customPhotoIds[1] = photoId2.value.trim();
    customPhotoIds[2] = photoId3.value.trim();
    
    lsSet(LS_PHOTOS, customPhotoIds);
    loadPhotoSettings();
    settingsPanel.classList.remove('open');
    
    if (currentTheme.startsWith('photo-') && !customPhotoIds[parseInt(currentTheme.split('-')[1])-1]) {
      setTheme('galaxy');
    }
  }

  /* ---------------- theme ---------------- */
  function applyTheme(name) {
    body.classList.remove('theme-galaxy', 'theme-aurora', 'theme-ember', 'theme-photo-1', 'theme-photo-2', 'theme-photo-3', 'has-custom-bg');
    
    if (name.startsWith('photo-')) {
      var idx = parseInt(name.split('-')[1], 10) - 1;
      var fileId = customPhotoIds[idx];
      if (fileId) {
        var url = 'https://lh3.googleusercontent.com/d/' + fileId + '=w2000';
        customBgLayer.style.backgroundImage = 'url("' + url + '")';
        body.classList.add('has-custom-bg');
      } else {
        name = 'galaxy';
      }
    }
    body.classList.add('theme-' + name);
  }

  function updateThemeDots() {
    var dotEls = themeDots.querySelectorAll('.theme-dot');
    for (var i = 0; i < dotEls.length; i++) {
      dotEls[i].classList.toggle('active', dotEls[i].getAttribute('data-theme') === currentTheme);
    }
  }

  function setTheme(name) {
    if (THEMES.indexOf(name) < 0) name = 'galaxy';
    currentTheme = name;
    lsSet(LS_THEME, name);
    applyTheme(name);
    updateThemeDots();
    updateToggleLabel();
  }

  function updateToggleLabel() {
    var label = currentTheme.replace('photo-', 'Photo ');
    label = label.charAt(0).toUpperCase() + label.slice(1);
    toggleBtn.textContent = screenOn ? 'Screen: ON' : 'Screen: OFF ✦ ' + label;
  }

  /* ---------------- history render ---------------- */
  function renderHistory() {
    historyCount.textContent = String(historyCache.length);
    historyList.innerHTML = '';
    if (!historyCache.length) {
      var empty = document.createElement('div');
      empty.className = 'history-empty';
      empty.textContent = 'No history yet';
      historyList.appendChild(empty);
      return;
    }
    historyCache.forEach(function (item) {
      var row = document.createElement('div');
      row.className = 'history-item';
      row.setAttribute('role', 'button');
      row.tabIndex = 0;

      var icon = document.createElement('span');
      icon.className = 'h-play'; icon.textContent = '▶';

      var info = document.createElement('div');
      info.className = 'h-info';

      var title = document.createElement('div');
      title.className = 'h-title';
      title.textContent = item.title || item.id;

      var meta = document.createElement('div');
      meta.className = 'h-meta';
      meta.setAttribute('data-at', String(item.at || 0));
      meta.textContent = timeAgo(item.at);

      info.appendChild(title); info.appendChild(meta);

      var del = document.createElement('button');
      del.className = 'h-del'; del.type = 'button'; del.textContent = '✕';
      del.title = 'Remove';
      del.addEventListener('click', function (e) {
        e.stopPropagation();
        apiRemoveHistory(item.id).then(function (updated) {
          historyCache = Array.isArray(updated) ? updated : historyCache.filter(function (x) { return x.id !== item.id; });
          renderHistory();
        });
      });

      row.appendChild(icon); row.appendChild(info); row.appendChild(del);
      
      // INSTANT PLAY LOGIC
      row.addEventListener('click', function () { 
        doToggleHistory(); // Close history panel
        setScreen(true); // Ensure screen is ON
        
        // Delay slightly to let UI update
        setTimeout(function() {
          withPlayerApi(function () { 
            createPlayer(item.id, 0, true); // Force auto-play
          }); 
        }, 100);
      });
      
      row.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); row.click(); }
      });
      historyList.appendChild(row);
    });
  }

  function refreshAgoLabels() {
    var nodes = historyList.querySelectorAll('.h-meta[data-at]');
    for (var i = 0; i < nodes.length; i++) {
      var ts = parseInt(nodes[i].getAttribute('data-at'), 10) || 0;
      nodes[i].textContent = timeAgo(ts);
    }
    if (savedCache) renderSavedBanner();
  }

  /* ---------------- saved banner ---------------- */
  function renderSavedBanner() {
    if (!savedCache) { savedBanner.style.display = 'none'; return; }
    savedTitle.textContent = savedCache.title || savedCache.id;
    savedMeta.textContent = 'at ' + formatTime(savedCache.time) + ' · ' + timeAgo(savedCache.at);
    savedBanner.style.display = 'flex';
  }

  /* ---------------- player ---------------- */
  function setTitle(text) {
    currentVideoTitle = text || '';
    songTitle.textContent = text || 'Now playing';
  }
  function refreshTitle() {
    if (!player || typeof player.getVideoData !== 'function') return;
    var d = null;
    try { d = player.getVideoData(); } catch (e) {}
    if (d && d.title) setTitle(d.title);
  }
  
  function createPlayer(vid, startAt, autoPlay) {
    if (player && typeof player.destroy === 'function') {
      try { player.destroy(); } catch (e) {}
    }
    player = null;
    isPlaying = false;
    recordedThisPlayer = false;
    currentVideoId = vid;
    currentVideoTitle = '';
    pendingSeek = Math.max(0, startAt || 0);
    
    playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>'; 
    setTitle('Loading...');
    playerWrap.innerHTML = '<div id="player"></div>';

    player = new YT.Player('player', {
      width: '100%', height: '100%', videoId: vid,
      playerVars: { enablejsapi: 1, autoplay: autoPlay ? 1 : 0, playsinline: 1, rel: 0, fs: 1 },
      events: {
        onReady: function () {
          refreshTitle();
          if (pendingSeek > 0) {
            try { player.seekTo(pendingSeek, true); } catch (e) {}
          }
          if (autoPlay) {
            try { player.playVideo(); } catch (e) {}
          }
        },
        onStateChange: function (e) {
          if (e.data === YT.PlayerState.PLAYING) {
            if (pendingSeek > 0) {
              try { player.seekTo(pendingSeek, true); } catch (err) {}
              pendingSeek = 0;
            }
            isPlaying = true;
            playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
            refreshTitle();
            if (!recordedThisPlayer) {
              recordedThisPlayer = true;
              apiAddHistory(currentVideoId, currentVideoTitle).then(function (updated) {
                if (Array.isArray(updated)) { historyCache = updated; renderHistory(); }
              });
            }
          } else if (e.data === YT.PlayerState.PAUSED ||
                     e.data === YT.PlayerState.ENDED  ||
                     e.data === YT.PlayerState.UNSTARTED) {
            isPlaying = false;
            playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
            refreshTitle();
          } else {
            refreshTitle();
          }
        },
        onError: function (e) {
          var msg = 'Video unavailable.';
          if (e.data === 2)   msg = 'Invalid video ID.';
          if (e.data === 5)   msg = 'This video cannot be played in an embedded player.';
          if (e.data === 100) msg = 'Video not found or private.';
          if (e.data === 101 || e.data === 150) msg = 'The owner does not allow embedding.';
          setTitle(msg);
        }
      }
    });
  }

  /* ---------------- actions ---------------- */
  function doLoad() {
    var raw = searchInput.value.trim();
    var searchMatch = raw.match(/youtube\.com\/results\?search_query=([^&]+)/);
    if (searchMatch) {
      openExternal('https://www.youtube.com/results?search_query=' + searchMatch[1]);
      return;
    }
    var id = extractVideoId(raw);
    if (!id) { alert('Please paste a valid YouTube link or an 11-character video ID.'); return; }
    
    // Hide search container after successful load to keep UI clean
    searchContainer.classList.add('hidden-search');
    
    withPlayerApi(function () { createPlayer(id, 0, false); });
  }

  function doTogglePlay() {
    if (isLocked) return; 
    if (!player || typeof player.playVideo !== 'function') {
      if (savedCache && savedCache.id) {
        withPlayerApi(function () { createPlayer(savedCache.id, savedCache.time || 0, true); });
        return;
      }
      if (!screenOn) setScreen(true); else searchInput.focus();
      return;
    }
    if (isPlaying) player.pauseVideo(); else player.playVideo();
  }

  function doSave() {
    if (isLocked) return;
    if (!currentVideoId) {
      alert('Nothing to save yet — load a video first.');
      if (screenOn) searchInput.focus();
      return;
    }
    var title = currentVideoTitle;
    var time = 0;
    if (player && typeof player.getCurrentTime === 'function') {
      try { time = player.getCurrentTime() || 0; } catch (e) { time = 0; }
      try {
        var d = player.getVideoData();
        if (d && d.title) title = d.title;
      } catch (e) {}
    }
    var flashBtn = screenOn ? saveBtn : gSaveBtn;
    var original = flashBtn.textContent;
    flashBtn.textContent = '…';
    apiSaveState(currentVideoId, title, time).then(function (saved) {
      if (saved) { savedCache = saved; renderSavedBanner(); }
      flashBtn.textContent = '✓';
      setTimeout(function () { flashBtn.textContent = original; }, 1200);
    });
  }

  function doToggleHistory() {
    if (isLocked) return;
    var isOpen = historyPanel.classList.toggle('open');
    if (isOpen) {
      clearTimeout(idleTimer);
      body.classList.remove('idle');
    } else {
      resetIdleTimer();
    }
  }

  function setScreen(on) {
    if (isLocked && !on) return;
    screenOn = on;
    body.classList.toggle('mode-on', on);
    body.classList.toggle('mode-off', !on);
    updateToggleLabel();
    
    clearTimeout(idleTimer);
    if (!on) {
      refreshTitle();
      resetIdleTimer();
    } else {
      body.classList.remove('idle');
    }
  }

  /* ---------------- wire up ---------------- */
  loadBtn.addEventListener('click', doLoad);
  searchInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') doLoad();
  });
  searchBtn.addEventListener('click', function () {
    var kw = searchInput.value.trim();
    if (!kw) { searchInput.focus(); return; }
    openExternal('https://www.youtube.com/results?search_query=' + encodeURIComponent(kw));
  });

  playBtn.addEventListener('click', doTogglePlay);
  saveBtn.addEventListener('click', doSave);
  historyBtn.addEventListener('click', doToggleHistory);
  toggleBtn.addEventListener('click', function () { setScreen(!screenOn); });
  
  // Toggle Search Field
  toggleSearchBtn.addEventListener('click', function () {
    searchContainer.classList.toggle('hidden-search');
    if (!searchContainer.classList.contains('hidden-search')) {
      searchInput.focus();
    }
  });

  // Toggle More Options (Save & Themes)
  toggleMoreBtn.addEventListener('click', function () {
    saveBtn.classList.toggle('hidden-btn');
    settingsBtn.classList.toggle('hidden-btn');
    if (saveBtn.classList.contains('hidden-btn')) {
      toggleMoreBtn.textContent = '⚙️ More';
      settingsPanel.classList.remove('open');
    } else {
      toggleMoreBtn.textContent = '✖ Close';
    }
  });

  settingsBtn.addEventListener('click', function() { settingsPanel.classList.toggle('open'); });
  saveSettingsBtn.addEventListener('click', savePhotoSettings);

  gSaveBtn.addEventListener('click', doSave);
  gHistoryBtn.addEventListener('click', doToggleHistory);
  
  gLockBtn.addEventListener('click', function() {
    if (!isLocked) {
      lockScreen();
    } else {
      requestUnlock();
    }
  });
  
  gScreenBtn.addEventListener('click', function () { setScreen(true); });

  themeDots.addEventListener('click', function (e) {
    if (isLocked) return;
    var dot = e.target.closest('.theme-dot');
    if (!dot) return;
    var name = dot.getAttribute('data-theme');
    if (name) setTheme(name);
  });

  closeHistoryBtn.addEventListener('click', doToggleHistory);
  clearHistoryBtn.addEventListener('click', function () {
    if (!historyCache.length) return;
    if (!confirm('Clear the entire play history?')) return;
    apiClearHistory().then(function () { historyCache = []; renderHistory(); });
  });

  resumeBtn.addEventListener('click', function () {
    if (!savedCache) return;
    var s = savedCache;
    withPlayerApi(function () { createPlayer(s.id, s.time || 0, true); });
  });
  dismissSavedBtn.addEventListener('click', function () {
    apiClearSaved().then(function () { savedCache = null; renderSavedBanner(); });
  });

  /* ---------------- init ---------------- */
  function init() {
    loadPhotoSettings();

    var savedTheme = lsGet(LS_THEME, 'galaxy');
    if (THEMES.indexOf(savedTheme) < 0) savedTheme = 'galaxy';
    setTheme(savedTheme);

    // Load from Worker (or LocalStorage fallback)
    Promise.all([apiGetHistory(), apiGetSaved()]).then(function (res) {
      historyCache = Array.isArray(res[0]) ? res[0] : [];
      savedCache = res[1] || null;
      renderHistory();
      renderSavedBanner();
    });

    setInterval(refreshAgoLabels, 60000);
  }

  init();
})();
</script>
</body>
</html>
